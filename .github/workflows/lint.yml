name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1
      - name: Lint all markdown files
        run: markdownlint "**/*.md" --ignore node_modules

  charter-validate:
    name: Charter validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Run charter validator on changed project folders
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'projects/**' | grep -oP 'projects/[^/]+' | sort -u || true)
          if [[ -n "$CHANGED" ]]; then
            echo "Validating: $CHANGED"
            python3 tools/charter-validator.py $CHANGED
          else
            echo "No project cell changes — skipping charter validation"
          fi

  cloudflare-standard:
    name: Cloudflare standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Validate policy and tests
        run: |
          python3 tools/validate-cloudflare-standard.py ops/cloudflare-standard.json
          python3 -m unittest discover -s tests -v
